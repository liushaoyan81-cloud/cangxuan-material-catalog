name: Deploy website

on:
  push:
    branches: ["codex/publish-cangxuan-site"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4
      - name: Build static publish directory
        shell: bash
        run: |
          mkdir -p dist
          cp index.html app.js styles.css docs.css 404.html .nojekyll dist/
          cp -R public/company-pages public/tile-pages public/bathroom-pages public/flooring-pages dist/
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
